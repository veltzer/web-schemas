# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.checker.ruff]
src_dirs = ["scripts"]


[processor.checker.mypy]
src_dirs = ["scripts"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

[processor.checker.ijsonlint]
src_dirs = ["docs/json"]

[processor.checker.tidy]
src_dirs = ["docs"]

[processor.generator.generic.jsonschema]
command = "scripts/check_json_schema.py"
src_dirs = ["docs/json"]
src_extensions = [".json"]
output_dir = "out/check"
output_extension = "stamp"
batch = false

# lint the GitHub Actions workflow files with actionlint
[processor.checker.actionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = ["docs/yaml", "support"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.xmllint]
src_dirs = ["docs"]
